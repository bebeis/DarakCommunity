spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/community;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  #    url: jdbc:mysql://localhost:3307/community
  #    username: root
  #    password: test1234
  #    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
    #        format_sql: true
    #        show-sql: true
    defer-datasource-initialization: true

  messages:
    basename: messages, errors
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true
  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace

# 파일 업로드 설정
app:
  upload:
    dir: ${user.home}/darak-uploads/ # 사용자 홈 디렉터리에 업로드 폴더 생성

server:
  servlet:
    session:
      tracking-modes: cookie
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      cache:
        time-to-live: 1s
  info:
    java:
      enabled: true
    os:
      enabled: true
    git:
      mode: full
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: darak-community
      environment: cloudtype

---
spring:
  profiles:
    active: dev